name: elyx_digital_assignment
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: 9.1.1
  bloc: 9.2.1
  equatable: 2.1.0
  bloc_concurrency: 0.3.0
  stream_transform: 2.1.2

  dio: 5.11.1

  dartz: 0.10.1

  get_it: 9.2.1

  hive_ce: 2.19.3
  hive_ce_flutter: 2.3.4

  connectivity_plus: 7.3.1

  cached_network_image: 3.4.1

  intl: 0.20.3

  cupertino_icons: 1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drives the real app on a simulator/device. Used to produce the README
  # screenshots reproducibly -- `flutter drive` walks the app through each
  # state and writes a PNG per state, so the images cannot drift from the UI.
  integration_test:
    sdk: flutter

  bloc_test: 10.0.0
  mockito: 5.6.4
  build_runner: 2.15.1
  hive_ce_generator: 1.11.1

  flutter_lints: 6.0.0

  flutter_launcher_icons: 0.14.4

flutter:

  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#24292F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  ios: true
  remove_alpha_ios: true
